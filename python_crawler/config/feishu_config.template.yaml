# 飞书多维表格配置模板
# 复制此文件为 feishu_config.yaml 并填入你的凭证

feishu:
  # 应用凭证（从飞书开放平台获取）
  app_id: "cli_xxxxxxxxxxxxx"        # 你的应用 ID
  app_secret: "xxxxxxxxxxxxxx"        # 你的应用密钥

  # 多维表格信息
  bitable:
    app_token: "bascnxxxxxxxxxxxxxx"  # 表格 Token（从 URL 中获取）
    table_id: "tblxxxxxxxxxxxxxx"     # 表 ID（从 URL 中获取）

  # 字段映射（可选，使用默认值可省略）
  field_mapping:
    asin: "field_asin"
    title: "field_title"
    price: "field_price"
    rating: "field_rating"
    description: "field_description"
    url: "field_url"
    created_at: "field_created_at"

# 同步配置
sync:
  batch_size: 50                      # 批量写入大小（飞书限制 500 条/次）
  enable_dedup: true                   # 启用去重
  dedup_field: "asin"                  # 去重字段
  auto_sync: true                      # 爬取后自动同步

# 使用方法：
# 1. 复制此文件: cp config/feishu_config.template.yaml config/feishu_config.yaml
# 2. 填入你的凭证信息
# 3. 运行: ./run_automation.sh --pages 2 --products 20 --feishu
